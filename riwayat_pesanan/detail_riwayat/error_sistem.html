<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Sistem CORIN</title>
    <style>
        .error{
            background: #fee2e2;;
            color : #991b1b;
            border-left:5px solid #dc2626;
            padding:20px;
            border-radius:12px;
            margin:20px 0;
        }
         .back a{
            display:inline-block;
            padding:12px 25px;
            background:#2980b9;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-weight:600;
            transition:.3s;
            margin: 20px auto;
        }
        .back a:hover{
            transform:translateY(-3px);
            box-shadow:0 8px 20px rgba(41,128,185,.3);
        }
    </style>
</head>
<body>
    <div class="error">
        <h1>Sistem CORIN sedang error !</h1>
        <p>Data Detail tranksasi tidak ditemukan</p>
    </div>

    <div class="back">
         <a href="../riwayat_pemesanan.html">Kembali</a>
    </div>
</body>
</html>

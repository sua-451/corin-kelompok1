<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Edit Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../theme.css?v=9">
</head>
<body>

    <div class="dashboard-container">
        
        <!-- Sidebar kiri: kembali ke menu utama -->
        <aside class="main-sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-gear"></i>
            </div>
            
            <nav class="sidebar-nav">
                <a href="../tampilan menu/menu.html" class="nav-item">
                    <span>← Kembali</span>
                </a>
            </nav>
        </aside>

        <!-- Area Konten Utama -->
        <main class="main-content">
            
            <!-- Header Atas -->
            <header class="top-header">
                <h1 class="header-title">Profile</h1>
                <div class="header-actions">
                    <button class="icon-btn" aria-label="Notifikasi">
                        <i class="fa-regular fa-bell"></i>
                    </button>
                    <div class="user-avatar-small">
                        <img src="pp/wowo.jpg" alt="wowo">
                    </div>
                    <i class="fa-solid fa-chevron-down dropdown-icon"></i>
                </div>
            </header>

            <!-- Grid Konten (Sub-Sidebar + Form) -->
            <div class="content-body">
                
                <nav class="sub-sidebar">
                    <a href="#profile-saya" class="sub-nav-item active">
                        <span>Profil Saya</span>
                    </a>
                    <a href="#edit-profile" class="sub-nav-item">
                        <i class="fa-solid fa-pencil"></i>
                        <span>Edit Profile</span>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                    <a href="#" class="sub-nav-item">
                        <i class="fa-regular fa-bell"></i>
                        <span>Notifikasi</span>
                    </a>
                    <a href="#" class="sub-nav-item">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>Keamanan</span>
                    </a>
                </nav>

                <!-- Form Edit Profil -->
                <section class="form-section" id="profile-saya">
                    <h2 class="section-title">Profil Saya</h2>

                    <!-- Avatar Profile / Upload Foto -->
                    <div class="avatar-upload-container">
                        <div class="avatar-wrapper">
                            <img src="pp/wowo.jpg" alt="wowo">
                            <button class="camera-btn" aria-label="Ubah foto profil">
                                <i class="fa-solid fa-camera"></i>
                            </button>
                        </div>
                    </div>

                    <div class="profile-identity">
                        <h3>KELOMPOK 1</h3>
                        <p>PBL-250315056</p>
                    </div>

                    <!-- Input Form -->
                    <form class="profile-form">
                        <h3 class="edit-title" id="edit-profile">Edit Profile</h3>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nama depan">Nama depan</label>
                                <input type="text" id="nama depan" value="">
                            </div>
                            <div class="form-group">
                                <label for="nama belakang">nama belakang</label>
                                <input type="text" id="nama belakang" value="">
                            </div>
                        </div>

                        <div class="form-row">
                          <div class="form-group">
                           <label for="nohp">No HP</label>
                        <input type="text" id="nohp">
                    </div>
                  <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                    </div>
                    </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-save">Save</button>
                        </div>

                    </form>
                </section>

            </div>
        </main>

    </div>

</body>
</html>

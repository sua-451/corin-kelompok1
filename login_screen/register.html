<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f4f6f9;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .register-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .register-logo h1 {
            font-size: 32px;
            font-weight: 300;
        }

        .register-logo h1 span {
            font-weight: 700;
        }

        .register-logo p {
            margin-top: 8px;
            color: #777;
        }

        .register-card {
            background: white;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #80bdff;
        }

        .register-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            justify-content: right;
        }

        .register-options button {
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            background: #28a745;
            color: white;
            cursor: pointer;
        }

        .register-options button:hover {
            background: #218838;
        }

        .register-links {
            text-align: center;
            margin-top: 20px;
        }

        .register-links a {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <!-- Logo / Title -->
        <div class="register-logo">
            <h1>Register</h1>
        </div>


        <!-- Register Card -->
        <div class="register-card">

            <form>

                <!-- Full Name -->
                <div class="input-group">
                    <input
                        type="text"
                        name="name"
                        placeholder="Nama Panjang"
                        required
                    >
                </div>


                <!-- Email -->
                <div class="input-group">
                    <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        required
                    >
                </div>


                <!-- Password -->
                <div class="input-group">
                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required
                    >
                </div>


                <!-- Confirm Password -->
                <div class="input-group">
                    <input
                        type="password"
                        name="confirm-password"
                        placeholder="Confirm Password"
                        required
                    >
                </div>


                <!-- Options -->
                <div class="register-options">

                    <button type="submit">
                        Register
                    </button>

                </div>

            </form>

        </div>


        <!-- Login Link -->
        <div class="register-links">

            <a href="login.html">
                Sudah punya akun
            </a>

        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f4f6f9;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .register-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .register-logo h1 {
            font-size: 32px;
            font-weight: 300;
        }

        .register-logo h1 span {
            font-weight: 700;
        }

        .register-logo p {
            margin-top: 8px;
            color: #777;
        }

        .register-card {
            background: white;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #80bdff;
        }

        .role-picker {
            display: flex;
            position: relative;
            margin-bottom: 18px;
            padding: 4px;
            border-radius: 6px;
            background: #edf1f5;
        }

        .role-picker input {
            position: absolute;
            opacity: 0;
        }

        .role-picker label {
            position: relative;
            z-index: 1;
            flex: 1;
            padding: 10px 12px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            color: #555;
            transition: color 0.2s ease;
        }

        .role-slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: calc(50% - 4px);
            border-radius: 4px;
            background: #28a745;
            transition: transform 0.25s ease, background-color 0.25s ease;
        }

        #buyer:checked ~ .role-slider {
            transform: translateX(100%);
            background: #007bff;
        }

        #seller:checked ~ label[for="seller"],
        #buyer:checked ~ label[for="buyer"] {
            color: white;
        }

        .register-options {
            text-align: right;
        }

        .register-options a {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 4px;
            background: #28a745;
            color: white;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .register-options a:hover {
            background: #218838;
        }

        .register-links {
            text-align: center;
            margin-top: 20px;
        }

        .register-links a {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
    <link rel="stylesheet" href="../theme.css?v=9">
</head>

<body>

    <div class="register-container">

        <!-- Logo / Title -->
        <div class="register-logo">
            <h1>Register</h1>
        </div>


        <!-- Register Card -->
        <div class="register-card">

            <form action="../tampilan%20menu/menu.html">

                <!-- Full Name -->
                <div class="input-group">
                    <input
                        type="text"
                        name="name"
                        placeholder="Nama Panjang"
                        required
                    >
                </div>


                <!-- Email -->
                <div class="input-group">
                    <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        required
                    >
                </div>


                <!-- Password -->
                <div class="input-group">
                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required
                    >
                </div>


                <!-- Confirm Password -->
                <div class="input-group">
                    <input
                        type="password"
                        name="confirm-password"
                        placeholder="Confirm Password"
                        required
                    >
                </div>


                <!-- Pilihan jenis akun -->
                <div class="role-picker">
                    <input type="radio" name="role" id="seller" checked>
                    <input type="radio" name="role" id="buyer">
                    <label for="seller">Penjual</label>
                    <label for="buyer">Pembeli</label>
                    <span class="role-slider"></span>
                </div>

                <!-- Tombol utama, masih berupa tautan statis ke menu -->
                <div class="register-options">
                    <button type="submit">Register</button>

                </div>

            </form>

        </div>


        <!-- Login Link -->
        <div class="register-links">

            <a href="login.html">
                Sudah punya akun
            </a>

        </div>

    </div>

</body>
</html>

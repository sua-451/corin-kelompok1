<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORIN </title>
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
        }
         header{
            display: flex;
            font-family:Verdana, Geneva, Tahoma, sans-serif;
            background-color: rgb(255, 174, 231);
            color : white;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            justify-content: space-between;
            align-items: center;
        }
        .navbar a   {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }
        .navbar {
            display: flex;
            gap: 5px;
        }
        .tombol{
             background: #e91e63;
             padding : 10px;
             border-radius: 5px;
             box-shadow: 0px 2px 1px black;
             transition: 0.3s all ease;
        }

        .tombol:hover{
            transform: translateY(-3px);
            background: rgb(211, 137, 195);
        }
        .judul-kontainer {
            position:relative ;
            width: 100%;
            height: calc(100vh-130px);
            overflow: hidden;
        }
        .judul-kontainer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.2;
        }
        .judul {
            position: absolute;
            top : 50%;
            left : 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color : white;
            width: 80%;
        }
        .judul h1 {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 70px;
            font-weight: bold;
            margin-bottom: 10px;
            color :  rgb(255, 174, 231);
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }

        .judul p {
            font-size: 30px;
            text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.8);
        }
        body {
            background: black;
        }

        footer {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
             background-color: rgb(245, 136, 212);
            color: rgb(254, 254, 254);
            width: 100%;
            height: 50px;
            display: flex;
            font-size: 20px;
            justify-content: center;
        }
        footer p {
            align-self: center;
        }
        .garis {
            width: 900px;
            height: 2px;
            background: #e91e63;
            justify-self: center;
            margin-top: 10px;
        }

    </style>
</head>
<body>
    <body>
        <header>
            <div class="header_judul">
                <h1>CORIN</h1>
                <p>Selamat Datang di Kantin Politeknik Negeri Cilacap</p>
            </div>
            <div class="navbar">
                <div class="tombol">
                    <a href="login_screen/register.html">Register</a>
                </div>
                <div class="tombol">
                    <a href="login_screen/login.html">Login</a>
                </div>
            </div>
        </header>

        <div class="judul-kontainer">
            <img src="riwayat_pesanan/gambar/index.png" alt="gambar index">
            <div class="judul">
                <h1>CORIN</h1>
                <p>Canteen Ordering & Retrieval Information Network</p>
                <div class="garis"></div>
            </div>
        </div>
    </body>

    <footer>
        <p>Project Web CORIN by Kelompok 1 </p>
    </footer>
</body>
</html>
